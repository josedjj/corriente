name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Import check
        run: python -c "import libtorrent, PySide6; print('libtorrent', libtorrent.__version__)"

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build with PyInstaller
        run: >
          pyinstaller main.py --name Corriente --windowed --onedir --noconfirm --clean
          --icon assets/corriente.ico --collect-all libtorrent --exclude-module tkinter

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Corriente -DestinationPath Corriente-windows-x64.zip

      # Artefacto sin firmar: cuando SignPath apruebe el proyecto, aquÃ­ se aÃ±ade
      # el paso de firma (signpath/github-action-submit-signing-request).
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: Corriente-windows-x64
          path: dist/Corriente

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME Corriente-windows-x64.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME Corriente-windows-x64.zip --title "Corriente $env:GITHUB_REF_NAME" --generate-notes
          }
